<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF4E6">
<title>حكاية حنين وامتحان الجمعة</title>
<link rel="icon" href="../icons/fav-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Baloo Bhaijaan 2',system-ui,sans-serif;color:#2b2140;background:radial-gradient(circle at 10% 0%,#ffe7f1 0,transparent 40%),radial-gradient(circle at 95% 10%,#e4ecff 0,transparent 40%),#fff8ef;min-height:100vh}
button{font-family:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:70px 16px 60px}
.hero{display:flex;align-items:center;gap:18px;margin-bottom:18px}
.av{width:84px;height:84px;border-radius:50%;padding:4px;background:linear-gradient(135deg,#ff8fb8,#9c86f0);flex-shrink:0;box-shadow:0 10px 24px -10px #9c86f0}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #fff}
.hero h1{margin:0;font:700 34px/1.25 'Aref Ruqaa',serif;color:#4a2a6b}
.hero p{margin:4px 0 0;font-size:15px;font-weight:700;color:#8a6f84}
.wk{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:800;color:#b4386e;background:#ffe3ee;border-radius:999px;padding:2px 12px}
.tabs{display:flex;gap:10px;margin:6px 0 20px;flex-wrap:wrap}
.tab{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:20px;background:#fff;border:2px solid #f3dce6;font-weight:800;font-size:17px;color:#6b4a7a;box-shadow:0 4px 0 #f3dce6}
.tab .i{font-size:22px}
.tab.on{background:linear-gradient(135deg,#ff8fb8,#9c86f0);color:#fff;border-color:transparent;box-shadow:0 4px 0 #7d63d6}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.book{all:unset;cursor:pointer;position:relative;overflow:hidden;border-radius:28px;min-height:230px;padding:22px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 18px 34px -20px rgba(60,30,90,.6);transition:transform .15s}
.book:active{transform:scale(.98)}
.book .cv{position:absolute;inset:0}
.book .cv svg{width:100%;height:100%}
.book .tx{position:relative;background:rgba(255,255,255,.92);color:#3b2550;border-radius:20px;padding:12px 16px}
.book b{display:block;font-size:22px;font-weight:800;line-height:1.3}
.book small{font-size:13.5px;font-weight:700;color:#8a6f84}
.book .lang{position:absolute;top:14px;left:14px;background:#fff;color:#7d63d6;font-weight:900;font-size:12px;border-radius:999px;padding:2px 12px}
.book .done{position:absolute;top:14px;right:14px;background:#22c55e;color:#fff;font-weight:900;font-size:12px;border-radius:999px;padding:2px 12px}
.reader{display:none}
.reader.on{display:block}
.rbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ib{all:unset;cursor:pointer;width:44px;height:44px;border-radius:14px;background:#fff;border:2px solid #f3dce6;display:grid;place-items:center;color:#7d63d6;flex-shrink:0}
.ib svg{width:20px;height:20px}
.rt{flex:1;min-width:0}
.rt b{display:block;font-size:20px;font-weight:800;color:#4a2a6b}
.rt small{font-size:13px;font-weight:700;color:#8a6f84}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}
.dots i{width:9px;height:9px;border-radius:50%;background:#f0d9e6;display:block}
.dots i.on{background:#9c86f0;width:24px;border-radius:9px}
.dots i.ok{background:#22c55e}
.page{display:grid;grid-template-columns:1.05fr 1fr;gap:18px;background:#fff;border-radius:32px;padding:16px;box-shadow:0 24px 50px -34px rgba(80,40,120,.55);border:1px solid #f6e6ee}
.scene{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:4/3;background:#fde}
.scene svg{width:100%;height:100%;display:block}
.scene .hn{position:absolute;bottom:12px;right:12px;width:23%;aspect-ratio:1;border-radius:50%;padding:3px;background:linear-gradient(135deg,#ff8fb8,#9c86f0);box-shadow:0 8px 18px -6px rgba(0,0,0,.35)}
.scene .hn img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #fff}
.scene .bub{position:absolute;bottom:calc(16px + 31%);right:8%;max-width:58%;background:#fff;border-radius:18px 18px 4px 18px;padding:8px 12px;font-weight:800;font-size:15px;color:#4a2a6b;box-shadow:0 8px 18px -10px rgba(0,0,0,.4);line-height:1.5}
.ltr .scene .hn{right:auto;left:12px}
.ltr .scene .bub{right:auto;left:8%;border-radius:18px 18px 18px 4px}
.txt{display:flex;flex-direction:column;gap:12px;padding:6px 6px 4px}
.pn{font-size:13px;font-weight:900;color:#c06092}
.story{font-size:25px;line-height:2.05;font-weight:600;color:#2b2140}
.ltr .story{font-family:'Fredoka','Baloo Bhaijaan 2',sans-serif;font-size:24px;line-height:1.75;direction:ltr;text-align:left}
.w{cursor:pointer;background:linear-gradient(transparent 58%,#ffe28a 58%);border-radius:4px;padding:0 2px;font-weight:800;color:#a8326a;transition:background .2s}
.w.sel{background:#ffe28a}
.tip{min-height:46px;border-radius:16px;background:#f4efff;border:1.5px dashed #c9b8f5;padding:9px 14px;font-size:15.5px;font-weight:800;color:#5b3fb0;display:flex;align-items:center;gap:8px}
.tip:empty{display:none}
.ltr .tip{direction:ltr}
.ctr{display:flex;gap:8px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:16px;font-weight:800;font-size:15px;background:#fff;border:2px solid #f3dce6;color:#6b4a7a}
.btn svg{width:18px;height:18px}
.btn.p{background:linear-gradient(135deg,#ff8fb8,#9c86f0);border-color:transparent;color:#fff;box-shadow:0 4px 0 #7d63d6}
.btn.g{background:#22c55e;border-color:#22c55e;color:#fff;box-shadow:0 4px 0 #15803d}
.btn:disabled,.btn.dis{opacity:.4;pointer-events:none}
.qbox{border-radius:20px;background:#fff8ef;border:2px solid #fde2c2;padding:12px 14px}
.qbox h4{margin:0 0 8px;font-size:16.5px;font-weight:800;color:#9a4a12}
.ltr .qbox{direction:ltr;text-align:left}
.ops{display:grid;gap:8px}
.op{all:unset;cursor:pointer;padding:10px 14px;border-radius:14px;background:#fff;border:2px solid #fde2c2;font-weight:700;font-size:16px;color:#3b2550}
.op.ok{background:#dcfce7;border-color:#22c55e;color:#14532d}
.op.no{background:#fee2e2;border-color:#ef4444;color:#7f1d1d}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
.end{text-align:center;background:#fff;border-radius:32px;padding:26px 18px;box-shadow:0 24px 50px -34px rgba(80,40,120,.55)}
.end .st{font-size:46px;letter-spacing:8px;color:#f59e0b;margin:6px 0}
.end h2{margin:0;font:700 32px 'Aref Ruqaa',serif;color:#4a2a6b}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:18px;text-align:right}
.ltr .gl{direction:ltr;text-align:left}
.gi{background:#fff8ef;border:1.5px solid #fde2c2;border-radius:16px;padding:10px 12px}
.gi b{display:block;font-size:18px;color:#a8326a}
.gi span{font-size:14px;font-weight:700;color:#6b4a7a}
.exam{display:none}
.exam.on{display:block}
.paper{background:#fff;border-radius:28px;padding:22px 20px;box-shadow:0 24px 50px -34px rgba(80,40,120,.55);border:1px solid #f6e6ee;margin-bottom:18px}
.ph{display:flex;align-items:center;gap:14px;border-bottom:2px dashed #f0d9e6;padding-bottom:14px;margin-bottom:14px;flex-wrap:wrap}
.ph h2{margin:0;font:700 28px 'Aref Ruqaa',serif;color:#4a2a6b;flex:1}
.ph .meta{font-size:14px;font-weight:800;color:#8a6f84;display:flex;gap:14px;flex-wrap:wrap}
.ph .meta span{border-bottom:2px dotted #d9c3d1;min-width:110px;padding-bottom:2px}
.sec{margin:18px 0}
.sec h3{margin:0 0 10px;font-size:19px;font-weight:800;color:#7d63d6;display:flex;align-items:center;gap:8px}
.sec h3 i{font-style:normal;width:30px;height:30px;border-radius:10px;background:#efe9ff;display:grid;place-items:center;font-size:15px}
.ltr{direction:ltr;text-align:left}
.ltr .sec h3{direction:ltr}
.psg{background:#fff8ef;border-radius:16px;padding:12px 16px;font-size:20px;line-height:1.95;font-weight:600;margin-bottom:12px;border:1.5px solid #fde2c2}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f6eef2}
.item:last-child{border-bottom:0}
.item .n{width:28px;height:28px;border-radius:50%;background:#ffe3ee;color:#b4386e;font-weight:900;font-size:14px;display:grid;place-items:center;flex-shrink:0}
.item .q{font-size:18.5px;font-weight:700;flex:1 1 260px;line-height:1.7}
.ch{display:flex;gap:6px;flex-wrap:wrap}
.c{all:unset;cursor:pointer;padding:6px 14px;border-radius:12px;border:2px solid #e9def0;background:#fff;font-weight:800;font-size:16px;color:#4a2a6b}
.c.sel{background:#efe9ff;border-color:#9c86f0;color:#5b3fb0}
.graded .c.right{background:#dcfce7;border-color:#22c55e;color:#14532d}
.graded .c.sel.wrong{background:#fee2e2;border-color:#ef4444;color:#7f1d1d}
.ord{display:flex;flex-direction:column;gap:8px;flex:1 1 100%}
.pool,.line{display:flex;gap:6px;flex-wrap:wrap;min-height:44px;padding:6px;border-radius:14px}
.line{background:#f7f3ff;border:2px dashed #c9b8f5}
.pool .c,.line .c{font-size:17px}
.mark{font-weight:900;font-size:18px;min-width:24px}
.graded .mark.ok:after{content:"✔";color:#16a34a}
.graded .mark.no:after{content:"✘";color:#dc2626}
.ans{display:none;font-size:14px;font-weight:800;color:#15803d;flex-basis:100%}
.graded .ans{display:block}
.res{display:none;align-items:center;gap:16px;background:linear-gradient(135deg,#fff2c9,#ffe3ee);border-radius:22px;padding:14px 18px;margin-top:12px;flex-wrap:wrap}
.res.on{display:flex}
.res b{font-size:30px;font-weight:900;color:#b4386e}
.res .st{font-size:28px;letter-spacing:4px;color:#f59e0b}
.res p{margin:0;font-weight:800;color:#6b4a7a;flex:1}
.eacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.sw{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
@media (max-width:820px){.page{grid-template-columns:1fr}.story{font-size:22px}.hero h1{font-size:27px}.wrap{padding-top:64px}}
@media print{
  body{background:#fff}
  #hnn-bar,.hero,.tabs,.sw,.eacts,.res,.reader,.pick,.mark,.ans{display:none!important}
  .exam{display:block!important}
  .paper{box-shadow:none;border:1px solid #999;border-radius:0;break-after:page}
  .paper.hidep{display:none!important}
  .c{border:1px solid #999!important;background:#fff!important;color:#000!important}
  .line{border:1px solid #999}
  .wrap{padding:0}
}
</style>
</head>
<body>
<div class="wrap">

<script>
var W = {
  week: 'أسبوع ١٦ – ٢٢ نوفمبر',
  stories: [
    {
      id: 'ar1', lang: 'ar', title: 'حنين والبطلة الصغيرة', sub: 'حكاية بالعربي من دروس الوحدة الثانية', cover: 'bedroomAm',
      pages: [
        { sc: 'bedroomAm', bub: 'صباح الخير يا عصفور!', t: '{صباحًا|ظرف زمان: يدل على وقت، نسأل عنه بـ «متى؟»}، استيقظتْ حنينُ {مبكرًا|مضادها: متأخرًا}، على صوتِ عصفورٍ يغنّي {فوقَ|ظرف مكان: نسأل عنه بـ «أين؟»} {الشجرةِ|اللام شمسية: الشين حرف شمسي فلا ننطق اللام}.', q: ['متى استيقظتْ حنين؟', ['مبكرًا', 'متأخرًا', 'ليلًا'], 0] },
        { sc: 'messy', bub: 'النظامُ أجملُ!', t: 'نظرتْ حنينُ إلى {غرفتِها|معناها: حجرتها، وجمعها: غُرَف}: الكتبُ {تحتَ|ظرف مكان} السريرِ، والحقيبةُ {خلفَ|ظرف مكان، مضاده: أمامَ} البابِ! قالتْ: «{النظامُ|مضادها: الفوضى} أجملُ». ثم {رتّبتْ|معناها: نظّمتْ} كتبَها على {الرفوفِ|مفردها: رفّ}.', q: ['أين كانت الكتب؟', ['فوق السرير', 'تحت السرير', 'خلف الباب'], 1] },
        { sc: 'bathroom', bub: 'أسناني قويةٌ!', t: 'ذهبتْ حنينُ إلى الحمّامِ، وأمسكتِ {الفرشاةَ|جمعها: فُرَش، واللام قمرية: ننطقها}، و{غسلتْ|معناها: نظّفتْ} {أسنانَها|مفردها: سِنّ} جيدًا. ثم ابتسمتْ في {المرآةِ|جمعها: المرايا، واللام قمرية} وقالتْ: «أسناني {قويةٌ|مضادها: ضعيفة}».', q: ['بماذا غسلتْ حنين أسنانها؟', ['بالمشط', 'بالفرشاة', 'بالملعقة'], 1] },

        { sc: 'street', bub: 'تلك طائرة!', t: 'في الطريقِ إلى المدرسةِ رفعتْ حنينُ عينيها إلى السماءِ، وقالتْ: «{تلكَ|اسم إشارة للمؤنث البعيد} طائرةٌ تطيرُ بعيدًا، و{ذلكَ|اسم إشارة للمذكر البعيد} قمرٌ صغيرٌ ما زالَ يلمعُ!»', q: ['نشير إلى الطائرة البعيدة بكلمة:', ['هذه', 'تلك', 'ذلك'], 1] },

        { sc: 'class2', bub: 'تفضّلي قلمي', t: 'نسيتِ الزميلةُ قلمَها، فأعطتْها حنينُ قلمًا. قالتِ الزميلةُ: «{شكرًا|من الكلمات الجميلة} لكِ»، فقالتْ حنينُ: «{عفوًا|من الكلمات الجميلة}». الكلماتُ الجميلةُ {تُسعِدُ|معناها: تُفرح، مضادها: تُحزن} القلوبَ.', q: ['ماذا نقول لمن أعطانا شيئًا؟', ['شكرًا لك', 'لا أريد', 'اذهب'], 0] },

        { sc: 'kitchen', bub: 'Yummy!', t: 'This is the {kitchen|مطبخ — to cook}. Mum {cooks|تطبخ} {chicken|ch sound!} for {lunch|ch sound!}. {There is|one thing} a {fridge|ثلاجة — to keep food cold} in the kitchen.', q: ['Where does Mum cook?', ['in the kitchen', 'in the garden', 'in the bathroom'], 0] },
        { sc: 'living', bub: 'My favourite show!', t: 'This is the {living room|غرفة المعيشة}. There are a {T.v|تلفزيون}, a {couch|كنبة} and a {lamp|أباجورة}. Haneen {watches T.v|تشاهد التلفزيون} on the couch.', q: ['Haneen watches T.v ___ the couch.', ['on', 'under', 'in'], 0] },
        { sc: 'bathroom', bub: 'Clean and happy!', t: 'This is the {bathroom|حمّام}. Haneen {brushes her teeth|تغسل أسنانها} and {washes her face|تغسل وجهها}. There is a {shower|دُش} in the bathroom.', q: ['What does Haneen do in the bathroom?', ['She sleeps.', 'She brushes her teeth.', 'She cooks.'], 1] },
        { sc: 'bedroomEn', bub: 'Where is my cat?', t: 'This is the {bedroom|غرفة النوم}. Haneen {sleeps|تنام} in the bedroom. She {has|she → has} a cat. Look! The cat is {under|تحت} the bed!', q: ['Where is the cat?', ['on the bed', 'under the bed', 'next to the lamp'], 1] },

      secs: [

      if (answered[i] !== undefined) { if (k === p.q[2]) b.classList.add('ok'); else if (k === answered[i]) b.classList.add('no'); }
      b.onclick = function () { if (answered[i] !== undefined) return; answered[i] = k; if (k === p.q[2]) score++; draw(); };
      ops.appendChild(b);
    });
    qb.appendChild(ops); tx.appendChild(qb);
    pg.appendChild(tx); reader.appendChild(pg);
    var nav = el('div', 'nav');
    var pv = el('button', 'btn' + (i === 0 ? ' dis' : ''), s.lang === 'ar' ? 'السابقة' : 'Back'); pv.onclick = function () { i--; draw(); };
    var nx = el('button', 'btn p' + (answered[i] === undefined ? ' dis' : ''), i === s.pages.length - 1 ? (s.lang === 'ar' ? 'النهاية' : 'The end') : (s.lang === 'ar' ? 'التالية' : 'Next'));
    nx.onclick = function () { i++; draw(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    nav.appendChild(pv); nav.appendChild(el('span', '', answered[i] === undefined ? '<small style="font-weight:800;color:#8a6f84">' + (s.lang === 'ar' ? 'جاوب السؤال لتكمل' : 'Answer to go on') + '</small>' : '')); nav.appendChild(nx);
    reader.appendChild(nav);
  }
  function endStory() {

    var prog = LS.get('stories', {}); if (!prog[s.id] || prog[s.id] < stars) { prog[s.id] = stars; LS.set('stories', prog); }
    var e = el('div', 'end');
    e.innerHTML = '<h2>' + (s.lang === 'ar' ? 'أحسنتِ يا حنين!' : 'Well done, Haneen!') + '</h2><div class="st">' + '★★★'.slice(0, stars) + '<span style="color:#eadff0">' + '★★★'.slice(stars) + '</span></div><div style="font-weight:800;color:#6b4a7a">' + ar(score) + ' من ' + ar(n) + ' إجابات صحيحة</div>';
    var gl = el('div', 'gl');

    s.pages.forEach(function (p) { parse(p.t).words.forEach(function (w) { if (seen[w[0]]) return; seen[w[0]] = 1; gl.appendChild(el('div', 'gi', '<b>' + esc(w[0]) + '</b><span>' + esc(w[1]) + '</span>')); }); });
    e.appendChild(el('h3', '', s.lang === 'ar' ? 'كلمات الحكاية' : 'Story words')); e.lastChild.style.cssText = 'margin:22px 0 0;color:#7d63d6';
    e.appendChild(gl);
    var a = el('div', 'eacts'); a.style.justifyContent = 'center'; a.style.marginTop = '18px';
    var r = el('button', 'btn p', s.lang === 'ar' ? 'اقرأ مرة ثانية' : 'Read again'); r.onclick = function () { i = 0; answered = {}; score = 0; draw(); };
    var x = el('button', 'btn', 'كل الحكايات'); x.onclick = function () { history.back(); };
    a.appendChild(r); a.appendChild(x); e.appendChild(a);
    reader.appendChild(e);
  }
  draw();
}

function buildPaper(x) {
  var p = el('div', 'paper' + (x.lang === 'en' ? ' ltr' : ''));
  p.appendChild(el('div', 'ph', '<h2>' + esc(x.title) + '</h2><div class="meta"><span>' + (x.lang === 'ar' ? 'الاسم: حنين' : 'Name: Haneen') + '</span><span>' + (x.lang === 'ar' ? 'الصف: الثاني ٢ب' : 'Class: 2B') + '</span><span>' + esc(W.week) + '</span></div><div style="flex-basis:100%;font-size:14px;font-weight:700;color:#8a6f84">' + esc(x.sub) + '</div>'));
  var checks = [], qn = 0;
  x.secs.forEach(function (s, si) {
    var sec = el('div', 'sec');
    sec.appendChild(el('h3', '', '<i>' + (x.lang === 'ar' ? ar(si + 1) : (si + 1)) + '</i>' + esc(s.h)));
    if (s.psg) sec.appendChild(el('div', 'psg', esc(s.psg)));
    s.items.forEach(function (it) {
      qn++;
      var row = el('div', 'item');
      row.appendChild(el('span', 'n', x.lang === 'ar' ? ar(qn) : qn));
      var mk = el('span', 'mark');
      if (it.t === 'mcq') {
        row.appendChild(el('div', 'q', esc(it.q)));
        var ch = el('div', 'ch'), sel = { v: -1 };
        it.o.forEach(function (o, k) {
          var c = el('button', 'c', esc(o));
          if (k === it.a) c.classList.add('right-k');
          c.onclick = function () { if (p.classList.contains('graded')) return; ch.querySelectorAll('.c').forEach(function (z) { z.classList.remove('sel'); }); c.classList.add('sel'); sel.v = k; };
          ch.appendChild(c);
        });
        row.appendChild(ch); row.appendChild(mk);
        row.appendChild(el('div', 'ans', (x.lang === 'ar' ? 'الإجابة: ' : 'Answer: ') + esc(it.o[it.a])));
        checks.push(function () { var ok = sel.v === it.a; mk.className = 'mark ' + (ok ? 'ok' : 'no'); ch.querySelectorAll('.c').forEach(function (z, k) { z.classList.toggle('right', k === it.a); z.classList.toggle('wrong', z.classList.contains('sel') && k !== it.a); }); return ok; });
      } else if (it.t === 'ord') {
        var box = el('div', 'ord'), line = el('div', 'line'), pool = el('div', 'pool');
        shuffle(it.w).forEach(function (w) {
          var c = el('button', 'c', esc(w));
          c.onclick = function () { if (p.classList.contains('graded')) return; (c.parentNode === pool ? line : pool).appendChild(c); };
          pool.appendChild(c);
        });
        box.appendChild(line); box.appendChild(pool); row.appendChild(box); row.appendChild(mk);
        row.appendChild(el('div', 'ans', (x.lang === 'ar' ? 'الإجابة: ' : 'Answer: ') + esc(it.a)));
        checks.push(function () { var got = Array.prototype.map.call(line.querySelectorAll('.c'), function (z) { return z.textContent; }).join(' '); var ok = got === it.a || (it.alt || []).indexOf(got) >= 0; mk.className = 'mark ' + (ok ? 'ok' : 'no'); return ok; });
      }
      sec.appendChild(row);
    });
    p.appendChild(sec);
  });
  var res = el('div', 'res'); p.appendChild(res);
  var acts = el('div', 'eacts');
  var g = el('button', 'btn p', x.lang === 'ar' ? 'صحّح الامتحان' : 'Check my answers');
  var rs = el('button', 'btn', x.lang === 'ar' ? 'امتحان من جديد' : 'Try again');
  var pr = el('button', 'btn', x.lang === 'ar' ? 'اطبع الورقة' : 'Print');
  g.onclick = function () {
    var s = 0; checks.forEach(function (f) { if (f()) s++; });
    p.classList.add('graded');
    var pct = s / checks.length, st = pct >= .9 ? 3 : pct >= .7 ? 2 : 1;
    res.innerHTML = '<b>' + (x.lang === 'ar' ? ar(s) + ' / ' + ar(checks.length) : s + ' / ' + checks.length) + '</b><span class="st">' + '★★★'.slice(0, st) + '<span style="color:#eadff0">' + '★★★'.slice(st) + '</span></span><p>' + (pct === 1 ? (x.lang === 'ar' ? 'ممتاز! الدرجة النهائية' : 'Excellent! Full mark') : pct >= .7 ? (x.lang === 'ar' ? 'شاطرة! راجعي الأسئلة الحمراء' : 'Great! Check the red ones') : (x.lang === 'ar' ? 'نراجع الإجابات الخضراء ونحاول تاني' : 'Look at the green answers and try again')) + '</p>';
    res.classList.add('on');
    var h = LS.get('exams', {}); h[x.id] = Math.max(h[x.id] || 0, s); LS.set('exams', h);
    res.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
  rs.onclick = function () { var n = buildPaper(x); p.parentNode.replaceChild(n, p); };
  pr.onclick = function () { window.print(); };
  acts.appendChild(g); acts.appendChild(rs); acts.appendChild(pr);
  p.appendChild(acts);
  return p;
}
